name: Analyser regression

on:
  push:
    branches:
      - main
      - development
      - 'rebuild/**'
    paths:
      - 'services/music-analyser/**'
      - '.github/workflows/analyser-regression.yml'
  pull_request:
    branches:
      - main
      - development
      - 'rebuild/**'
    paths:
      - 'services/music-analyser/**'
      - '.github/workflows/analyser-regression.yml'
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

concurrency:
  group: analyser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Independent beat evaluation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/music-analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt

      - name: Download pinned model and held-out recordings
        run: |
          python download_model.py
          python download_evaluation.py

      - name: Compare CPU trackers with independent labels
        run: python evaluate.py

      - name: Upload analyser evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyser-evaluation-report
          path: services/music-analyser/evaluation-report.json
          if-no-files-found: warn
          retention-days: 14
