name: Analyser regression

on:
  push:
    branches:
      - main
      - development
    paths:
      - "platform/analyser/**"
      - "data/media/audio/jamendo/**"
      - ".github/workflows/analyser-regression.yml"
  pull_request:
    branches:
      - main
      - development
    paths:
      - "platform/analyser/**"
      - "data/media/audio/jamendo/**"
      - ".github/workflows/analyser-regression.yml"
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

concurrency:
  group: analyser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Real-audio baseline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: platform/analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt

      - name: Run analyser real-audio regression
        run: python evaluate.py

      - name: Upload analyser evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyser-evaluation-report
          path: platform/analyser/evaluation-report.json
          if-no-files-found: warn
          retention-days: 14
