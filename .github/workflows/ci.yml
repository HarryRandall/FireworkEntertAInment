name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENROUTER_API_KEY: ci-placeholder-openrouter-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  analyser:
    name: Python analyser tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/music-analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt

      - name: Run analyser unit tests
        run: python -m unittest discover -s tests -p "*test*.py"

  analyser-contract:
    name: Python to Zod to planner contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r services/music-analyser/requirements.txt

      - name: Run Python to Zod to planner contract
        env:
          SHOWCRAFTER_RUN_CROSS_LANGUAGE_CONTRACT: '1'
        run: python services/music-analyser/tests/test_schema_validation.py

  worker:
    name: Firework import worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/firework-import-worker/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install worker dependencies
        run: python -m pip install -r services/firework-import-worker/requirements.txt

      - name: Run worker unit tests
        run: python -m unittest discover -s services/firework-import-worker/tests -p "*test*.py"
