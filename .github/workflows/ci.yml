name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the current main commit to production after all CI checks pass
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENROUTER_API_KEY: ci-placeholder-openrouter-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  analyser:
    name: Python analyser tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/music-analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt

      - name: Run analyser unit tests
        run: python -m unittest discover -s tests -p "*test*.py"

  analyser-contract:
    name: Python to Zod to planner contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r services/music-analyser/requirements.txt

      - name: Run Python to Zod to planner contract
        env:
          SHOWCRAFTER_RUN_CROSS_LANGUAGE_CONTRACT: '1'
        run: python services/music-analyser/tests/test_schema_validation.py

  worker:
    name: Firework import worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/firework-import-worker/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install worker dependencies
        run: python -m pip install -r services/firework-import-worker/requirements.txt

      - name: Run worker unit tests
        run: python -m unittest discover -s services/firework-import-worker/tests -p "*test*.py"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Check worker output against the app and renderer
        run: pnpm test:import-contract

  database:
    name: Fresh database and access checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database-tooling
      - name: Install and verify a fresh database
        run: |
          pnpm db:start
          pnpm db:bootstrap --local
          pnpm db:verify --local
          pnpm db:test
          pnpm db:types --check
          pnpm db:lint
      - name: Prove a second clean replay and repeatable fixtures
        run: |
          pnpm db:reset
          pnpm db:bootstrap --local
          pnpm db:verify --local
          pnpm db:test
          pnpm db:fixtures
          pnpm db:fixtures
          pnpm db:fixtures:check
          pnpm db:bootstrap --local
      - name: Stop the test database
        if: always()
        run: pnpm db:stop

  deploy:
    name: Migrate then deploy production
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production == true
    needs: [web, analyser, analyser-contract, worker, database]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Reject a superseded release
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Its checked release will deploy instead."
            exit 1
          fi
      - name: Check deployment configuration
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "Missing deployment setting: $name"; exit 1; fi
          done
      - run: pnpm install --frozen-lockfile
      - name: Fetch the production application settings
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Check the database and application target
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          node scripts/database/deployment-check.mjs
      - name: Apply tested schema migrations
        run: pnpm exec supabase db push --linked
      - name: Build the tested commit
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the tested build
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
