name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENROUTER_API_KEY: ci-placeholder-openrouter-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install platform dependencies
        run: npm ci

      - name: Run platform lint
        run: npm run lint

      - name: Run platform typecheck
        run: npm run typecheck

      - name: Run platform tests
        run: npm test

      - name: Build platform
        run: npm run build

  analyser:
    name: Python analyser tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: platform/analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt

      - name: Run analyser unit tests
        run: python -m unittest discover -s tests -p "*test*.py"

  analyser-contract:
    name: Python to Zod to planner contract
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install platform dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: platform/analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r analyser/requirements.txt

      - name: Run Python to Zod to planner contract
        env:
          SHOWCRAFTER_RUN_CROSS_LANGUAGE_CONTRACT: "1"
        run: >-
          python -m unittest
          analyser.tests.test_schema_validation.SchemaValidationTests.test_actual_python_json_passes_zod_and_builds_cue_slots
