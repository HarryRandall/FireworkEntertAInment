name: CI

on:
  push:
    branches:
      - main
      - development
      - rebuild/main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the current main commit to production after all CI checks pass
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENROUTER_API_KEY: ci-placeholder-openrouter-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Check for unused files and exports
        run: pnpm knip

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run workspace package tests
        run: pnpm test:packages

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check renderer browser journeys
        run: pnpm test:browser

  analyser:
    name: Python analyser tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/music-analyser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r requirements.txt -r ../workers/requirements.txt -e ../worker-common

      - name: Lint analyser
        run: python -m pip install ruff==0.16.9 && ruff check .

      - name: Run analyser unit tests
        run: python -m unittest discover -s tests -p "*test*.py"

  analyser-contract:
    name: Python to planner music contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: services/music-analyser/requirements.txt

      - name: Install analyser dependencies
        run: python -m pip install -r services/music-analyser/requirements.txt -e services/worker-common

      - name: Run Python to planner music contract
        env:
          SHOWCRAFTER_RUN_CROSS_LANGUAGE_CONTRACT: '1'
        run: python services/music-analyser/tests/test_schema_validation.py

  database:
    name: Fresh database and access checks
    runs-on: ubuntu-latest
    env:
      # Supabase's official mirror avoids public ECR limits on shared runners.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database-tooling
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
      - name: Install shared worker and Modal layout dependencies
        run: |
          python -m venv services/worker-common/.venv
          services/worker-common/.venv/bin/python -m pip install -r services/worker-common/requirements.txt -r services/workers/requirements.txt -e services/worker-common
      - name: Check shared worker behaviour and Modal registration
        run: pnpm test:workers
      - name: Verify local database foundations
        run: |
          pnpm db:start
          pnpm db:reset
          pnpm db:test
          pnpm db:lint
          pnpm db:types --check
          pnpm db:seeds --check
          pnpm db:validators --check
          pnpm db:documents --check
      - name: Exercise fake Python worker against local Supabase
        run: pnpm test:workers:local
      - name: Install music analyser dependencies
        run: |
          python -m venv services/music-analyser/.venv
          services/music-analyser/.venv/bin/python -m pip install -r services/music-analyser/requirements.txt -e services/worker-common
      - name: Install verified neural checkpoint
        run: services/music-analyser/.venv/bin/python services/music-analyser/download_model.py
      - name: Check saved-show music requeue transaction
        env:
          SHOWCRAFTER_TEST_LOCAL_DATABASE: '1'
        run: services/music-analyser/.venv/bin/python -m unittest discover -s services/music-analyser/tests -p test_requeue.py
      - name: Exercise music jobs with offline audio against local Supabase
        run: pnpm test:analyser:local
      - name: Install video measurement dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m venv services/video-importer/.venv
          services/video-importer/.venv/bin/python -m pip install -r services/video-importer/requirements.txt -r services/workers/requirements.txt -e services/worker-common
      - name: Check deterministic video measurements
        run: pnpm test:video
      - name: Exercise video jobs against local Supabase
        run: pnpm test:video:local
      - name: Stop the test database
        if: always()
        run: pnpm db:stop

  deploy:
    name: Migrate then deploy production
    # Production deployments must originate from refs/heads/main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true))
    needs: [web, analyser, analyser-contract, database]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Reject a superseded release
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Its checked release will deploy instead."
            exit 1
          fi
      - name: Check deployment configuration
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "Missing deployment setting: $name"; exit 1; fi
          done
      - run: pnpm install --frozen-lockfile
      - name: Fetch the production application settings
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Check the database and application target
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          node scripts/database/deployment-check.mjs
      - name: Apply tested schema migrations
        run: pnpm exec supabase db push --linked
      - name: Build the tested commit
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the tested build
        run: pnpm dlx --allow-build=esbuild vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
