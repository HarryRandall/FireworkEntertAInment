<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                colors: {

                    "on-secondary-fixed-variant": "#62400f",
                    "on-error-container": "#ffdad6",
                    "surface-bright": "#3a3939",
                    "surface": "#131313",
                    "on-error": "#690005",
                    "secondary-fixed-dim": "#f0bd82",
                    "tertiary-container": "#1abdff",
                    "outline": "#a08e7a",
                    "error-container": "#93000a",
                    "inverse-surface": "#e5e2e1",
                    "on-secondary-container": "#ddac72",
                    "tertiary-fixed-dim": "#7fd0ff",
                    "tertiary-fixed": "#c5e7ff",
                    "primary-fixed": "#ffddb8",
                    "error": "#ffb4ab",
                    "on-primary": "#472a00",
                    "surface-variant": "#353534",
                    "on-secondary": "#472a00",
                    "primary-fixed-dim": "#ffb95f",
                    "surface-container-highest": "#353534",
                    "on-surface-variant": "#d8c3ad",
                    "surface-container-high": "#2a2a2a",
                    "on-primary-fixed": "#2a1700",
                    "on-primary-fixed-variant": "#653e00",
                    "on-surface": "#e5e2e1",
                    "surface-dim": "#131313",
                    "on-tertiary": "#00344a",
                    "secondary-fixed": "#ffddb8",
                    "on-background": "#e5e2e1",
                    "on-tertiary-container": "#004966",
                    "primary": "#ffc174",
                    "tertiary": "#8fd5ff",
                    "on-secondary-fixed": "#2a1700",
                    "on-tertiary-fixed-variant": "#004c6a",
                    "outline-variant": "#534434",
                    "secondary": "#f0bd82",
                    "primary-container": "#f59e0b",
                    "on-tertiary-fixed": "#001e2d",
                    "surface-container-low": "#1c1b1b",
                    "inverse-primary": "#855300",
                    "surface-container-lowest": "#0e0e0e",
                    "on-primary-container": "#613b00",
                    "surface-tint": "#ffb95f",
                    "inverse-on-surface": "#313030"
                },
                fontFamily: {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
                },
                borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
        },
    }
</script>
<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
        font-family: 'Inter', sans-serif;
        background-color: #131313;
    }
</style>
</head>
<body class="text-on-surface selection:bg-primary/30 antialiased min-h-screen flex flex-col">

<!-- Minimal Nav -->
<nav class="bg-[#131313] font-['Inter'] antialiased tracking-tight text-sm font-medium fixed top-0 w-full z-50">
<div class="flex justify-between items-center h-16 px-6 lg:px-12 max-w-[1200px] mx-auto">
<a href="index.html" class="text-xl font-semibold tracking-tighter text-[#FFC174]">ShowCrafter</a>
<a href="index.html" class="text-[#D8C3AD] hover:text-[#FFC174] transition-colors text-sm font-medium">Back to Home</a>
</div>
</nav>

<!-- Login Form -->
<main class="flex-grow flex items-center justify-center px-6 pt-16">
<div class="w-full max-w-md space-y-8">
<!-- Header -->
<div class="text-center space-y-3">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">rocket_launch</span>
</div>
<h1 class="text-3xl font-bold tracking-tight">Welcome back</h1>
<p class="text-on-surface-variant">Sign in to your ShowCrafter account</p>
</div>

<!-- Form -->
<div class="bg-surface-container-high rounded-2xl p-8 border border-outline-variant/10 space-y-6">
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface uppercase tracking-wider">Email</label>
<input id="email" type="email" value="demo@showcrafter.com" class="w-full h-11 px-4 bg-surface-container-highest border-none rounded-md text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary/20 transition-all" placeholder="you@example.com"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface uppercase tracking-wider">Password</label>
<input id="password" type="password" value="password123" class="w-full h-11 px-4 bg-surface-container-highest border-none rounded-md text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter your password"/>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input type="checkbox" checked class="rounded bg-surface-container-highest border-outline-variant text-primary focus:ring-primary/20"/>
<span class="text-sm text-on-surface-variant">Remember me</span>
</label>
<a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
</div>
<button id="login-btn" class="w-full py-3 bg-primary-container text-on-primary-container rounded-full font-bold text-base hover:brightness-110 active:scale-[0.98] transition-all">
Sign In
</button>
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/10"></div></div>
<span class="relative bg-surface-container-high px-4 text-xs text-on-surface-variant uppercase tracking-widest">or</span>
</div>
<button id="guest-btn" class="w-full py-3 border border-outline-variant/20 text-on-surface rounded-full font-medium text-sm hover:bg-surface-container-highest/50 transition-all">
Continue as Guest
</button>
</div>

<!-- Sign up link -->
<p class="text-center text-on-surface-variant text-sm">
Don't have an account? <a href="#" id="signup-link" class="text-primary font-medium hover:underline">Sign up free</a>
</p>

<!-- Demo hint -->
<div class="bg-surface-container-low rounded-xl p-4 border border-outline-variant/5 text-center">
<p class="text-xs text-on-surface-variant"><span class="text-primary font-bold">Demo mode:</span> Any email and password will work. Pre-filled for convenience.</p>
</div>
</div>
</main>

<!-- Footer -->
<footer class="bg-[#0E0E0E] w-full py-8 mt-auto border-t border-[#534434]/15">
<div class="flex flex-col md:flex-row justify-between items-center px-6 max-w-[1200px] mx-auto gap-4">
<div class="font-['Inter'] text-xs uppercase tracking-widest text-[#D8C3AD]/60">&copy; 2026 ShowCrafter AI. All rights reserved.</div>
<div class="flex gap-8">
<a class="font-['Inter'] text-xs uppercase tracking-widest text-[#D8C3AD]/60 hover:text-[#FFC174] transition-colors" href="#">About</a>
<a class="font-['Inter'] text-xs uppercase tracking-widest text-[#D8C3AD]/60 hover:text-[#FFC174] transition-colors" href="#">Contact</a>
<a class="font-['Inter'] text-xs uppercase tracking-widest text-[#D8C3AD]/60 hover:text-[#FFC174] transition-colors" href="#">Privacy</a>
</div>
</div>
</footer>

<script>
function doLogin() {
    sessionStorage.setItem('showcrafter_logged_in', 'true');
    window.location.href = 'dashboard.html';
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('guest-btn').addEventListener('click', doLogin);
document.getElementById('signup-link').addEventListener('click', (e) => {
    e.preventDefault();
    doLogin();
});

// Allow Enter key to submit
document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
});
</script>
</body></html>
